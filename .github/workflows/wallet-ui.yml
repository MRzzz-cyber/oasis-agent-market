name: Wallet swap UI acceptance
on:
  workflow_dispatch:
  push:
    branches: [refactor/simple-base-mvp]
    paths:
      - apps/frontend/arbitrum-swap*
      - apps/frontend/rpc-quantity.js
      - scripts/check-swap-ui.mjs
      - .github/workflows/wallet-ui.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check responsive layout and visible error states
        run: node scripts/check-swap-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-swap-ui-screenshots
          path: ${{ runner.temp }}/swap-ui/*.png
          if-no-files-found: ignore
