name: Prediction crosschain funding acceptance
on:
  push:
    branches: [feat/prediction-crosschain-funding]
permissions:
  contents: read
concurrency:
  group: crosschain-funding
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-crosschain-docs.mjs
