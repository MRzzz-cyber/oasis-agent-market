name: Prediction crosschain funding acceptance
on:
  push:
    branches: [feat/prediction-crosschain-funding]
permissions:
  contents: read
concurrency:
  group: crosschain-funding
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read official API contracts, no account creation or financial writes
        run: |
          node --input-type=module <<'JS'
          for(const path of ['deposit','quote','status','supported-assets']){const u='https://docs.polymarket.com/trading/bridge/'+path+'.md';const r=await fetch(u,{signal:AbortSignal.timeout(15000)});console.log('DOCUMENT',u,r.status,await r.text());}
          const params=new URLSearchParams({fromChain:'42161',toChain:'137',fromToken:'0xaf88d065e77c8cc2239327c5edb3a432268e5831',toToken:'0xc011a7e12a19f7b1f670d46f03b03f3342e82dfb',fromAddress:'0x1111111111111111111111111111111111111111',toAddress:'0x2222222222222222222222222222222222222222',fromAmount:'12000000',integrator:'oasis-trade',slippage:'0.005'});
          const r=await fetch('https://li.quest/v1/quote?'+params,{signal:AbortSignal.timeout(30000)});console.log('LIFI QUOTE',r.status,(await r.text()).slice(0,18000));
          const assets=await (await fetch('https://bridge.polymarket.com/supported-assets')).json();console.log('USDC SUPPORT',assets.supportedAssets.filter(x=>['42161','8453','10'].includes(x.chainId)&&x.token.symbol==='USDC'));
          JS
