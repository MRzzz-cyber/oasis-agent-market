name: Oasis MVP CI
on:
  pull_request:
  push:
    branches: [main, "refactor/simple-base-mvp"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install x402 dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify source imports
        run: |
          node --check apps/api/server.mjs
          node --check apps/agent/core.mjs
          node --check apps/frontend/app.js
          node --check packages/evm/src/x402-transport.mjs
          node --check scripts/base-sepolia-market-server.mjs
      - name: Run automated tests
        run: npm test
      - name: Verify x402 SDK entrypoints
        run: node -e "Promise.all([import('@x402/fetch'), import('@x402/core/server'), import('@x402/evm/exact/client'), import('@x402/evm/exact/server'), import('@x402/express'), import('viem')]).then(()=>console.log('x402 SDK imports OK'))"
