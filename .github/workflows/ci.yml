name: Oasis CI

on:
  push:
    branches:
      - main
      - refactor/simple-base-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        env:
          HEDERA_PAYMENT_MODE: mock
          OASIS_MARKET_DATA_MODE: fixture
          OASIS_LLM_MODE: rule
        run: pnpm test
