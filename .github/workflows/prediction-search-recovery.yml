name: Prediction search recovery
on:
  push:
    branches: [fix/prediction-search-resilience]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-prediction-network.mjs
