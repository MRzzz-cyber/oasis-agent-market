name: Publish the research procurement release
on:
  push:
    branches: ["refactor/simple-base-mvp"]
    paths: [".github/workflows/publish-research-release.yml"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check the deployment channel
        id: channel
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Cloudflare API credentials are absent; the connected Workers build remains the deployment channel.'
          fi
      - uses: actions/checkout@v4
        if: steps.channel.outputs.available == 'true'
        with:
          ref: 752f8ff8bfc4b2aff80bd5ed5cff06b819a0df49
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.channel.outputs.available == 'true'
        with:
          node-version: '22'
      - name: Deploy the fixed release to the existing Worker
        if: steps.channel.outputs.available == 'true'
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --config wrangler.jsonc
