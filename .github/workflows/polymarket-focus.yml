name: Polymarket focused journey acceptance
on:
  push:
    branches: [feat/polymarket-focused-journey]
permissions:
  contents: read
concurrency:
  group: prediction-discovery
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Build wallet and Worker
        run: |
          npm run build:wallet
          node --input-type=module -e "import {build} from 'esbuild'; await build({entryPoints:['apps/frontend/worker.js'],bundle:true,format:'esm',platform:'browser',target:['es2022'],write:false});"
      - name: Install Chinese fonts for fixture visual review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Discovery and existing purchase browser fixtures
        run: |
          fixture_failures=0
          node scripts/check-bilingual-ui.mjs || fixture_failures=1
          node scripts/check-prediction-ui.mjs || fixture_failures=1
          node scripts/check-polymarket-purchase-ui.mjs || fixture_failures=1
          exit $fixture_failures
      - name: Polymarket relay and retained recovery guards in Workers
        if: always()
        run: |
          npm install --prefix "$RUNNER_TEMP/purchase-worker" --no-audit --no-fund miniflare@4
          node scripts/check-polymarket-purchase-worker.mjs
          npm install --prefix "$RUNNER_TEMP/kalshi-worker" --no-audit --no-fund miniflare@4
          node scripts/check-kalshi-worker.mjs
      - name: Emit fixture images for visual review
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          for(const name of ['prediction-ui/1280-feed','prediction-ui/390-buy','polymarket-purchase-ui/390-insufficient','bilingual-ui/390-index.html-app-en','bilingual-ui/1280-index.html-app']){try{const data=(await readFile(process.env.RUNNER_TEMP+'/'+name+'.png')).toString('base64');for(let i=0;i<data.length;i+=6000)console.log('OASIS_UI:'+name+':'+data.slice(i,i+6000));}catch{console.log('Fixture not available '+name);}}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-focused-journey-fixtures
          path: |
            ${{ runner.temp }}/bilingual-ui/*.png
            ${{ runner.temp }}/prediction-ui/*.png
            ${{ runner.temp }}/polymarket-purchase-ui/*.png
          if-no-files-found: ignore
