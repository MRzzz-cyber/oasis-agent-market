name: Polymarket purchase acceptance
on:
  push:
    branches: [feat/polymarket-wallet-purchase]
permissions:
  contents: read
concurrency:
  group: polymarket-purchase
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:wallet
        if: always()
      - name: Build Worker
        if: always()
        run: node --input-type=module -e "import {build} from 'esbuild'; await build({entryPoints:['apps/frontend/worker.js'],bundle:true,format:'esm',platform:'browser',target:['es2022'],write:false});"
      - name: Verify live public purchase metadata without wallet operations
        if: always()
        run: node scripts/check-polymarket-purchase-readonly.mjs
      - name: Real Chrome purchase and QR acceptance
        if: always()
        run: node scripts/check-polymarket-purchase-ui.mjs
      - name: Existing conversation and wallet browser regressions
        if: always()
        run: |
          node scripts/check-prediction-ui.mjs
          node scripts/check-swap-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-purchase-acceptance
          path: |
            ${{ runner.temp }}/polymarket-purchase-ui/*.png
            ${{ runner.temp }}/prediction-ui/*.png
            ${{ runner.temp }}/swap-ui/*.png
          if-no-files-found: ignore
